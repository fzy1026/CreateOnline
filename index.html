<!DOCTYPE html>
<html lang="cn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Online</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="layout">
        <div class="sidebar">
            <div class="sidebar-title">📦 资源</div>
            <div class="sidebar-item" id="wood_num"></div>
            <div class="sidebar-item" id="wood_axe_num"></div>
        </div>
        <div class="content">
            <h1 class="game-title">Create Online</h1>
            <button class="btn btn-primary" id="get_wood" onclick="GetWood()">
                <span class="btn-icon">🪓</span> 撸树
            </button>
            <div class="action-card">
                <button class="btn btn-secondary" id="buy_wood_axe" onclick="BuyWoodAxe()">
                    <span class="btn-icon">🛠️</span> 木斧（4原木/个）
                </button>
                <span class="action-desc">每次撸树获得木头数 +1</span>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
